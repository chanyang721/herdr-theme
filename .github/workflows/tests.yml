name: Theme checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check mods/sixfold-desk/main.js
      - run: node --check mods/sixfold-new-space/main.js

  python:
    # The optional collectors use POSIX fcntl and executable fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
