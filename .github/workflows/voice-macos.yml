name: Voice (macOS)

# Hosted macOS runners are often not assigned in time, and an unassigned job
# fails the run. So this runs only by hand and once a week, never on push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  voice:
    # The voice plugin reads macOS audio devices and installs a LaunchAgent.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --manifest-path rust/Cargo.toml --locked --jobs 1 voice:: -- --test-threads=1
        env:
          CARGO_BUILD_JOBS: '1'
      - run: cargo build --manifest-path rust/Cargo.toml --locked --bin herdr-theme --jobs 1
        env:
          CARGO_BUILD_JOBS: '1'
      - run: node --test voice/tests/native-install.test.mjs
        env:
          HERDR_THEME_BIN: ${{ github.workspace }}/rust/target/debug/herdr-theme
